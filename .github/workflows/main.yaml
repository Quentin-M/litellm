name: Build

on:
  push:
    branches: [ main, 'bitmex-*' ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, 'bitmex-*' ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:

  test-build:
    if: github.event_name == 'pull_request'
    runs-on: private-small
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          push: false
          tags: ${{ github.event.repository.name }}:test-${{ github.sha }}

  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bitmex-')
    runs-on: private-small
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      repository: 770953171216.dkr.ecr.eu-west-1.amazonaws.com/${{ github.event.repository.name }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@f24d7193d98baebaeacc7e2227925dd47cc267f5 # v4.2.0
        with:
          role-to-assume: arn:aws:iam::770953171216:role/github.com/BitMEX-private/${{ github.event.repository.name }}@ecr-push
          role-session-name: this
          aws-region: eu-west-1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Build Docker image and push to ECR
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        id: build
        with:
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bitmex-') }}
          tags: 770953171216.dkr.ecr.eu-west-1.amazonaws.com/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}
      - name: Attest
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bitmex-')
        id: attest
        with:
          subject-name: 770953171216.dkr.ecr.eu-west-1.amazonaws.com/${{ github.event.repository.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
